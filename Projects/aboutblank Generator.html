<body>
  <div class="console-container">
    <div class="console">
      <h1>about:blank Generator</h1>
      <div class="consolebody">
        <p>Enter a URL you want to be opened in an about:blank page below:</p>
        <p class="console-input"><input id="url-target" value="" autocomplete="on" type="text" autofocus=""></p>
        <p>Please make sure you have the https:// on the URL, it is best to just copy the link from the actual search
          bar!</p>
      </div>
    </div>
    <div class="button-wrapper">
      <button id="create" class="console-button">Create page</button>
      <button id="clear-input" class="console-button">Clear input</button>
    </div>
    
  </div>
  <script>
    console.log("Page Loaded! (" + window.location.href + ")");

    var url = document.getElementById("url-target");

    document.getElementById("clear-input").onclick = function () {
      url.value = "";
      console.log("Input Cleared!");
    };

    document.getElementById("create").onclick = function () {
      if (url.value.substring(0, 8) !== "https://" && url.value.substring(0, 7) !== "http://") {
        url.value = "https://" + url.value.split("https://").pop();
      } else if (url.value.substring(0, 7) == "http://") {
        url.value = "https://" + url.value.split("http://").pop();
      }

      var targetUrl = url.value;
      var win = window.open();
      if (!win) {
        console.warn("Page Open Failed! (The browser may have blocked the popup.)");
        return;
      }

      win.document.body.style.margin = "0";
      win.document.body.style.height = "100vh";
      var iframe = win.document.createElement("iframe");
      iframe.style.border = "none";
      iframe.style.width = "100%";
      iframe.style.height = "100%";
      iframe.style.margin = "0";
      iframe.referrerpolicy = "no-referrer";
      iframe.allow = "fullscreen";
      iframe.src = targetUrl;
      win.document.body.appendChild(iframe);
      console.log("Page Opened! (" + targetUrl + ")");
    };
  </script>
</body>
</html>
